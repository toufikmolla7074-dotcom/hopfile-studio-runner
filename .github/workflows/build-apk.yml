name: Build APK from Web Archive
on:
  repository_dispatch:
    types: [build-apk]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialize Android Web-View Wrapper Template
        run: |
          echo "Initializing lightweight Gradle project structure..."
          # Create template directory trees
          mkdir -p app/src/main/java/com/example/runner
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

          # 1. Create root settings.gradle
          cat << 'EOF' > settings.gradle
          rootProject.name = 'WebRunner'
          include ':app'
          EOF

          # 2. Create root build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.0.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # 3. Create app/build.gradle with direct dynamic parameters from trigger payload
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.runner'
              compileSdk 33

              defaultConfig {
                  applicationId "${{ github.event.client_payload.packageId }}"
                  minSdk 24
                  targetSdk 33
                  versionCode ${{ github.event.client_payload.versionCode }}
                  versionName "${{ github.event.client_payload.versionName }}"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          # 4. Create AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name="com.example.runner.MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 5. Create MainActivity.java
          cat << 'EOF' > app/src/main/java/com/example/runner/MainActivity.java
          package com.example.runner;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.view.Window;

          public class MainActivity extends Activity {
              private WebView mWebView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  
                  mWebView = new WebView(this);
                  WebSettings webSettings = mWebView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setDatabaseEnabled(true);
                  webSettings.setAllowFileAccess(true);
                  webSettings.setAllowContentAccess(true);
                  
                  mWebView.setWebViewClient(new WebViewClient());
                  mWebView.setBackgroundColor(0);
                  
                  mWebView.loadUrl("file:///android_asset/index.html");
                  setContentView(mWebView);
              }

              @Override
              public void onBackPressed() {
                  if (mWebView.canGoBack()) {
                      mWebView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          # 6. Create strings.xml with direct dynamic App Name from trigger payload
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">${{ github.event.client_payload.appName }}</string>
          </resources>
          EOF

      - name: Fetch and Wrap Website Archive ZIP
        run: |
          echo "Downloading web workspace ZIP archive from live source payload..."
          curl -L -o web_payload.zip "${{ github.event.client_payload.zipUrl }}"
          
          echo "Extracting workspace targets deep into assets folder..."
          unzip -o web_payload.zip -d app/src/main/assets/
          
          # Smart Extraction Check: if index.html is in a subfolder, bring contents to root of assets
          if [ ! -f app/src/main/assets/index.html ]; then
              echo "index.html not found in assets root. Checking subdirectories..."
              SUBDIR=$(find app/src/main/assets/ -name "index.html" -print -quit | sed 's|/index.html||')
              if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "app/src/main/assets" ]; then
                  echo "Found index.html in directory: $SUBDIR. Flattening contents..."
                  mv "$SUBDIR"/* app/src/main/assets/
              else
                  echo "WARNING: index.html not found in package payload!"
              fi
          fi
          
          # Clean up downloaded zip
          rm web_payload.zip

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Run APK Compile Gradle Task
        run: |
          gradle :app:assembleDebug

      - name: Deploy Compiled Artifact Back to Repository
        run: |
          echo "Setting up repository output folders..."
          mkdir -p builds
          cp app/build/outputs/apk/debug/app-debug.apk builds/app-debug.apk
          
          echo "Synchronizing git directories..."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add builds/app-debug.apk
          git commit -m "dist: update compiled android package for '${{ github.event.client_payload.appName }}'" || echo "No changes detected inside binary stream."
          git push origin main || git push origin master || echo "Push failed, continuing pipeline..."